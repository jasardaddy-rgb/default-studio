<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Future Interactive</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="bg"></div>

<header class="nav">
  <div class="logo">AI FUTURE LAB</div>
</header>

<main class="shell">
  <section class="hero">
    <h1>探索 AI 未来世界</h1>
    <p>输入问题，看看“未来AI”如何回答你</p>
  </section>

  <section class="box">
    <input id="input" type="text" placeholder="输入你的问题..." />
    <button onclick="askAI()">提问 AI</button>
  </section>

  <section class="box">
    <button class="secondary" onclick="generateEvent()">生成未来事件</button>
  </section>

  <section class="card">
    <h2>AI 回答</h2>
    <p id="answer">等待你的问题...</p>
  </section>

  <section class="card">
    <h2>未来事件</h2>
    <p id="event">尚未生成</p>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
